<style>
:root{--bg:#02060d;--fg:#bfefff;--ac:#19c3ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 25%,var(--bg2,#06223a),var(--bg) 70%);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
canvas{width:min(78vw,340px);height:min(78vw,340px);margin-top:6px;flex:none}
#st{font-size:12px;letter-spacing:3px;color:var(--ac);opacity:.8;margin:2px 0}
#log{flex:1;width:min(92vw,560px);overflow-y:auto;font-size:15px;line-height:1.4;padding:8px}
.j{color:var(--ac)}.u{color:#fff;opacity:.8}
#opts{display:flex;gap:6px;width:100%}
select{flex:1;min-width:0;background:rgba(255,255,255,.08);color:var(--fg);border:1px solid var(--ac);border-radius:8px;padding:6px;font-size:13px}
#bar{display:flex;gap:6px;width:min(92vw,560px);padding:8px 0 12px}
input{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid var(--ac);color:var(--fg);border-radius:10px;padding:10px;font-size:16px}
button{background:var(--ac);border:0;border-radius:10px;padding:10px 12px;font-size:16px;color:#001}
button.on{background:#7dff9c}
#m,#lk{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9}
#lk{z-index:10}#m[hidden],#lk[hidden]{display:none}
.pn{background:var(--bg);border:1px solid var(--ac);border-radius:14px;padding:14px;width:min(92vw,420px);max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
.pn h3{margin:0;color:var(--ac)}.pn label{display:flex;flex-direction:column;font-size:13px;gap:3px}.r{display:flex;gap:6px}.r button{flex:1}
</style>
</head>

const rg=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const LANGS={'Español':'es-ES','English':'en-US','Français':'fr-FR','Deutsch':'de-DE','Italiano':'it-IT','Português':'pt-BR','日本語':'ja-JP','한국어':'ko-KR','中文':'zh-CN','Русский':'ru-RU','العربية':'ar-SA','हिन्दी':'hi-IN','Türkçe':'tr-TR','Nederlands':'nl-NL','Polski':'pl-PL','Svenska':'sv-SE','עברית':'he-IL','Ελληνικά':'el-GR','Українська':'uk-UA','Tiếng Việt':'vi-VN','Bahasa Indonesia':'id-ID','ไทย':'th-TH','Català':'ca-ES','Română':'ro-RO','Čeština':'cs-CZ','Dansk':'da-DK','Suomi':'fi-FI','Norsk':'nb-NO','Magyar':'hu-HU'};

  f.sort((a,b)=>score(a)-score(b));
  $('voice').innerHTML='';f.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=(score(v)==0?'★ ':'')+v.name;$('voice').appendChild(o)});const sv2=get('voice');if(sv2&&[...$('voice').options].some(o=>o.value===sv2))$('voice').value=sv2;
}

// Cuerpo: esfera HUD estilo Jarvis
const P=[...Array(70)].map(()=>({a:Math.random()*7,r:70+Math.random()*130,s:(Math.random()-.5)*.02,z:Math.random()}));
function ring(cx,cy,r,w,dash,rot,al){x.save();x.translate(cx,cy);x.rotate(rot);x.strokeStyle=rg(TH.c[1],al);x.lineWidth=w;x.setLineDash(dash);x.beginPath();x.arc(0,0,r,0,7);x.stroke();x.restore()}
function draw(){
  t+=.02;const e=speaking?1:(listening&&awake>Date.now()?.7:.3+.08*Math.sin(t));energy+=(e-energy)*.08;
  x.clearRect(0,0,680,680);const cx=340,cy=340+Math.sin(t*1.2)*8;
  const R=80+energy*18,g=x.createRadialGradient(cx,cy,5,cx,cy,R*2.3);
  g.addColorStop(0,rg(TH.c[0],1));g.addColorStop(.25,rg(TH.c[1],.85));g.addColorStop(.6,rg(TH.c[2],.25));g.addColorStop(1,rg(TH.c[2],0));
  x.fillStyle=g;x.beginPath();x.arc(cx,cy,R*2.3,0,7);x.fill();
  ring(cx,cy,R+40,3,[60,20],t,.9);ring(cx,cy,R+62,1.5,[4,8],-t*1.4,.7);ring(cx,cy,R+88,6,[120,40,10,40],t*.6,.6);ring(cx,cy,R+112,1,[2,6],t*.3,.5);
  ring(cx,cy,R+20,2,[],0,.35+energy*.3);
  P.forEach(p=>{p.a+=p.s*(1+energy*3);const rr=p.r+energy*25;x.fillStyle=rg(TH.c[0],.3+.5*p.z);x.fillRect(cx+Math.cos(p.a)*rr,cy+Math.sin(p.a)*rr*.9,2+p.z*2,2+p.z*2)});
  requestAnimationFrame(draw)}
draw();
// Voz
function detect(t,pref){
  const S=[[/[\u0400-\u04FF]/,'ru-RU'],[/[\u0600-\u06FF]/,'ar-SA'],[/[\u0590-\u05FF]/,'he-IL'],[/[\u0370-\u03FF]/,'el-GR'],[/[\u0900-\u097F]/,'hi-IN'],[/[\u0E00-\u0E7F]/,'th-TH'],[/[\uAC00-\uD7AF]/,'ko-KR'],[/[\u3040-\u30FF]/,'ja-JP'],[/[\u4E00-\u9FFF]/,'zh-CN'],[/[ășțşţĂȘȚ]/,'ro-RO']];
  for(const [r,l] of S)if(r.test(t))return l;
  const W={'en-US':/\b(the|and|is|you|of|to|that|with|sir|for|this|are)\b/gi,'es-ES':/\b(el|la|los|las|que|de|es|y|un|una|con|por|para|señor)\b/gi,'fr-FR':/\b(le|les|des|est|et|une|vous|que|pour|avec|monsieur)\b/gi,'de-DE':/\b(der|die|das|und|ist|nicht|ein|ich|mit|sie|für)\b/gi,'it-IT':/\b(il|gli|che|di|un|una|con|per|signore)\b/gi,'pt-BR':/\b(os|as|que|um|uma|com|para|senhor|não)\b/gi,'nl-NL':/\b(de|het|een|en|niet|ik|je|met)\b/gi,'ro-RO':/\b(este|sunt|pentru|care|domnule|dar|mai|acum|bine)\b/gi,'tr-TR':/\b(bir|ve|bu|için|ile|efendim)\b/gi};
  let best=null,n=0;for(const l in W){const c=(t.match(W[l])||[]).length+(l===pref?.5:0);if(c>n){n=c;best=l}}if(n<1)return null;
  return best}
function pickVoice(lang){
  const nl=x=>x.toLowerCase().replace('_','-'),p=nl(lang).slice(0,2);
  const f=voices.filter(v=>nl(v.lang).startsWith(p));if(!f.length)return null;
  const sel=f.find(v=>v.name===$('voice').value);if(sel)return sel;
  const sc=v=>(/natural|neural|premium|enhanced|siri|google/i.test(v.name)?0:2)+(nl(v.lang)===nl(lang)?0:1);
  return f.sort((a,b)=>sc(a)-sc(b))[0]}
function say(m,lang){
  add('j','JARVIS: '+m);
  if(!('speechSynthesis' in window))return;
  const L=lang||detect(m,LOC[get('ui')])||$('lang').value;
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m);u.lang=L;
  const v=pickVoice(L);if(v)u.voice=v;u.rate=get('rate');u.pitch=get('pitch');u.volume=get('vol');
  u.onstart=()=>{speaking=true;if(rec)try{rec.stop()}catch(e){}};u.onend=()=>{speaking=false;if(listening)setTimeout(startRec,300)};speechSynthesis.speak(u)}
function add(c,m){const d=document.createElement('div');d.className=c;d.textContent=m;log.appendChild(d);log.scrollTop=log.scrollHeight}
// Escucha permanente con palabra de activación
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startRec(){
  if(!SR||!listening||speaking)return;
  rec=new SR();rec.lang=$('lang').value;rec.continuous=true;rec.interimResults=false;
  rec.onresult=ev=>{const s=ev.results[ev.results.length-1][0].transcript.trim();
    const m=s.match(/\b(j[aá]rvis|yarvis|jarvi|harvis|d[sz]arvis)\b[\s,.:]*(.*)/i);
    if(m){awake=Date.now()+9000;$('st').textContent=T('lg');if(m[2])handle(m[2]);else say(rnd(['Dígame, señor.','A sus órdenes.','Lo escucho, señor.']))}
    else if(awake>Date.now())handle(s)};
  rec.onend=()=>{if(listening&&!speaking)setTimeout(startRec,250)};
  rec.onerror=e=>{if(e.error==='not-allowed'){listening=false;$('ear').classList.remove('on');say(T('perm'))}};
  try{rec.start()}catch(e){}}
function startEar(){if(!SR)return say(T('nosr'));listening=true;$('ear').classList.add('on');$('st').textContent=T('ea');startRec()}
function stopEar(){listening=false;$('ear').classList.remove('on');$('st').textContent=T('on');try{rec&&rec.stop()}catch(e){}}
$('ear').onclick=()=>listening?stopEar():startEar();
$('mic').onclick=()=>{if(!SR)return say(T('nosr'));const r=new SR();r.lang=$('lang').value;r.onresult=e=>handle(e.results[0][0].transcript);r.start()};
// Funciones
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const verses=["Salmo 23:1 — El Señor es mi pastor, nada me faltará.","Josué 1:9 — Sé fuerte y valiente; Dios está contigo dondequiera que vayas.","Filipenses 4:13 — Todo lo puedo en Cristo que me fortalece.","Proverbios 3:5 — Confía en el Señor con todo tu corazón.","Isaías 41:10 — No temas, porque yo estoy contigo."];
const jokes=["¿Por qué los programadores confunden Halloween con Navidad? Porque 31 de octubre es igual a 25 de diciembre.","Tengo un chiste sobre UDP, pero no sé si le llegará.","Un byte entra a un bar y pide una cerveza. El camarero dice: ¿Quiere un bit más?"];
function save(){set('notes',notes)}
function handle(raw){
  raw=raw.trim();const q=raw.toLowerCase();if(!q)return;add('u',DB.cur+': '+raw);awake=Date.now()+9000;const h=new Date(),L=LOC[get('ui')];
  const sv=raw.match(/^servidor\s+(https:\/\/\S+)/i);if(sv){try{localStorage.setItem('jw',sv[1])}catch(e){}return say(T('cok'))}
  if(/\b(time|hora|heure|uhrzeit|uhr|ora)\b/.test(q))return say(T('time',{t:h.toLocaleTimeString(L,{hour:'2-digit',minute:'2-digit'})}));
  if(/fecha|\bdate\b|d[ií]a es hoy|today|datum|heute|oggi|hoje|aujourd|azi|ast[aă]zi|\bdata\b/.test(q))return say(T('date',{d:h.toLocaleDateString(L,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}));
  if(/vers[ií]culo|biblia|bible|versetto|oraci[oó]n|prayer/.test(q))return say(rnd(T('verses')));
  if(/chiste|broma|joke|blague|witz|barzelletta|piada|glum[aă]/.test(q))return say(rnd(T('jokes')));
  if(/moneda|cara o cruz|coin|pile ou face|m[uü]nze|moneta|moeda|moned[aă]/.test(q))return say(Math.random()<.5?T('ch'):T('ct'));
  if(/\bdado|dice|w[uü]rfel|\bdadi|\bzar/.test(q))return say(T('dice',{n:1+Math.floor(Math.random()*6)}));
  if(/bater[ií]a|estado del sistema|diagn[oó]stico|battery|batterie|batteria|baterie|status/.test(q)){const on=navigator.onLine?T('ol'):T('of');if(navigator.getBattery)return navigator.getBattery().then(b=>say(T('bat',{b:Math.round(b.level*100),o:on})));return say(T('bat',{b:'--',o:on}))}
  let m=q.match(/(temporizador|recu[eé]rdame|recordatorio|timer|remind|rappelle|minuteur|erinnere|promemoria|lembrete|aminte[sș]te|amintește).*?(\d+)\s*(seg\w*|sec\w*|sek\w*|min\w*|hou\w*|hor\w*|heur\w*|stund\w*|ora|ore|or[aă]|secund\w*|minut\w*)(?:\s*(?:para|de que|que|to|that|pour|zu|per|s[aă])\s+(.+))?/);
  if(m){const u=m[3],s=+m[2]*(/^(seg|sec|sek)/.test(u)?1:/^min/.test(u)?60:3600),txt=m[4]||T('td');setTimeout(()=>{say(T('tdone',{x:txt}));if(navigator.vibrate)navigator.vibrate([300,150,300]);if('Notification' in window&&Notification.permission==='granted')new Notification('JARVIS',{body:txt})},s*1000);
    if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();return say(T('tset',{n:m[2],u:u}))}
  const NP=/^(anota|nota|apunta|note|write down|remember|notiere|annota|anote|noteaz[aă])\s*(que|that|:)?\s*/i;
  if(NP.test(q)){notes.push(raw.replace(NP,''));save();return say(T('nok'))}
  if(/mis notas|lee las notas|my notes|mes notes|meine notizen|le mie note|minhas notas|not[iî][tț]ele mele/.test(q))return say(notes.length?T('nr',{x:notes.join('. ')}):T('nn'));
  if(/borra.*notas|delete.*notes|supprime.*notes|l[oö]sche.*notizen|elimina.*note|apague.*notas/.test(q)){notes=[];save();return say(T('nd'))}
  if(/cron[oó]metro|stopwatch|chronom|stoppuhr|cronometro|cronometru/.test(q)){if(!sw0){sw0=Date.now();return say(T('sw1'))}const sc=Math.round((Date.now()-sw0)/1000);sw0=0;return say(T('sw2',{m:Math.floor(sc/60),s:sc%60}))}
  m=q.match(/(?:abre|open|ouvre|[oö]ffne|apri|abra|deschide)\s+(youtube|google|maps|wikipedia|spotify|whatsapp)/);
  if(m){const u={youtube:'https://youtube.com',google:'https://google.com',maps:'https://maps.google.com',wikipedia:'https://wikipedia.org',spotify:'https://open.spotify.com',whatsapp:'https://web.whatsapp.com'}[m[1]];window.open(u,'_blank','noopener');return say(T('op',{x:m[1]}))}
  m=q.match(/(?:busca|buscar|search|cherche|suche|cerca|pesquisa|caut[aă])\s+(.+)/);
  if(m){window.open('https://www.google.com/search?q='+encodeURIComponent(m[1]),'_blank','noopener');return say(T('se'))}
  m=q.match(/(?:traduce|traducir)\s+(.+?)\s+(?:al|a)\s+(\w+)/);
  if(m){window.open('https://translate.google.com/?sl=auto&tl='+({inglés:'en',ingles:'en',frances:'fr',francés:'fr',alemán:'de',italiano:'it',portugués:'pt',japonés:'ja',chino:'zh-CN',árabe:'ar',ruso:'ru',español:'es'}[m[2]]||'en')+'&text='+encodeURIComponent(m[1]),'_blank','noopener');return say(T('tr'))}
  m=q.match(/(?:di|habla|pronuncia)\s+(.+?)\s+en\s+(\w+)/);
  if(m){const c={ingl:'en-US',franc:'fr-FR',alem:'de-DE',ital:'it-IT',portu:'pt-BR',japo:'ja-JP',chin:'zh-CN',ruso:'ru-RU',arab:'ar-SA',espa:'es-ES'};const k=Object.keys(c).find(k=>m[2].startsWith(k));return say(m[1],k?c[k]:null)}
  const e=q.replace(/cu[aá]nto es|calcula|what is|calculate|combien font|berechne|quanto fa|calcule/g,'').replace(/\bpor\b|x|\btimes\b|\bfois\b|\bmal\b/g,'*').replace(/m[aá]s|\bplus\b|\bmore\b/g,'+').replace(/menos|\bminus\b|\bmoins\b|\bmeno\b/g,'-').replace(/entre|dividido|divided by|divis[eé] par|geteilt durch|diviso/g,'/').replace(/,/g,'.');
  if(/^[\d\s+\-*/().]+$/.test(e)&&/\d/.test(e)){try{return say(T('res',{x:Function('"use strict";return ('+e+')')()}))}catch(_){}}
  if(/qui[eé]n eres|tu nombre|who are you|qui es-tu|wer bist du|chi sei|quem [eé] voc[eê]|cine e[sș]ti/.test(q))return say(T('who'));
  if(/gracias|thank|merci|danke|grazie|obrigad|mul[tț]umesc/.test(q))return say(T('thx'));
  if(/\bhola\b|buenos|buenas|hello|\bhi\b|bonjour|salut|hallo|ciao|ol[aá]|bun[aă]|\bsalut/.test(q))return say(T('hi',{n:DB.cur}));
  if(/ayuda|qu[eé] puedes|\bhelp\b|\baide\b|hilfe|aiuto|ajuda|ajutor/.test(q))return say(T('help'));
  let W='';try{W=localStorage.getItem('jw')||''}catch(e){}
  if(!W)return say(T('unk'));
  say(T('wait'));
  fetch(W,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:raw,lang:L})}).then(r=>{if(!r.ok)throw new Error('code '+r.status);return r.json()}).then(d=>say(d.reply||T('cnone'))).catch(err=>{add('u','[Detalle técnico: '+err.message+' | '+W+']');say(T('cbad'))})}
$('go').onclick=()=>{handle(inp.value);inp.value=''};

async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('jv|'+t));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
